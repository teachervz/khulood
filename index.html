<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المخططات البيانية – عرض تفاعلي</title>
<!-- الخط العربي (إن لم يتوفر الإنترنت سيُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والهوية البصرية — يمكنك تغيير الألوان من هنا
   ========================================================= */
:root{
  --p:#6D4BC3;        /* البنفسجي الأساسي */
  --p2:#8E6CE0;       /* بنفسجي فاتح */
  --pd:#3E2A7A;       /* بنفسجي داكن للعناوين */
  --lav:#F5F1FF;      /* خلفية لافندر */
  --lav2:#E7DDFF;     /* لافندر أغمق */
  --mint:#22B8A7;     /* لون مساعد (نعناعي) */
  --mintl:#DDF7F3;
  --peach:#FF9F80;    /* لون مساعد (خوخي) */
  --sun:#FFC857;      /* أصفر */
  --pink:#F2668F;     /* وردي للأخطاء اللطيفة */
  --pinkl:#FFE3EC;
  --ink:#2B2250;      /* لون النص */
  --muted:#6F6796;
  --bg:#FBF9FF;
  --card:#FFFFFF;
  --shadow:0 18px 40px -18px rgba(62,42,122,.35);
}

/* =========================================================
   2) الأساسيات: منع التمرير وتثبيت مقاس 16:9
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#E9E3F8}
body{font-family:'Tajawal','Cairo','Segoe UI','Geeza Pro',Tahoma,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* المسرح: 1920×1080 ويتم تكبيره/تصغيره ليناسب أي شاشة دون تغيير التصميم */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;
  overflow:hidden;background:var(--bg);box-shadow:0 0 80px rgba(62,42,122,.15)}
/* زخارف ناعمة في الخلفية */
#stage::before,#stage::after{content:"";position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none;z-index:0}
#stage::before{width:620px;height:620px;background:radial-gradient(circle,#EDE4FF 0%,rgba(237,228,255,0) 70%);top:-220px;left:-160px}
#stage::after{width:720px;height:720px;background:radial-gradient(circle,#DDF7F3 0%,rgba(221,247,243,0) 70%);bottom:-300px;right:-220px}
.dots{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(#D9CCFF 2px,transparent 2px);background-size:46px 46px;
  -webkit-mask-image:linear-gradient(135deg,#000 0%,transparent 35%,transparent 70%,#000 100%);mask-image:linear-gradient(135deg,#000 0%,transparent 35%,transparent 70%,#000 100%)}
#progress{position:absolute;top:0;right:0;height:8px;background:linear-gradient(90deg,var(--mint),var(--p));z-index:50;transition:width .5s ease;border-radius:0 0 0 8px}

/* =========================================================
   3) الشرائح والانتقالات
   ========================================================= */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:56px 110px 140px;z-index:1}
.slide.active{display:flex;z-index:2}
.slide.leaving{display:flex;z-index:1;pointer-events:none;animation:leave .45s ease forwards}
.slide.active[data-trans="fade"]{animation:inFade .7s ease both}
.slide.active[data-trans="zoom"]{animation:inZoom .7s cubic-bezier(.2,.8,.2,1) both}
.slide.active[data-trans="slide"][data-dir="f"]{animation:inSlideF .7s cubic-bezier(.2,.8,.2,1) both}
.slide.active[data-trans="slide"][data-dir="b"]{animation:inSlideB .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes leave{to{opacity:0;transform:scale(.98)}}
@keyframes inFade{from{opacity:0}}
@keyframes inZoom{from{opacity:0;transform:scale(.94)}}
@keyframes inSlideF{from{opacity:0;transform:translateX(-90px)}}
@keyframes inSlideB{from{opacity:0;transform:translateX(90px)}}

/* ظهور العناصر بالتتابع */
.slide.active .a{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * .09s + .2s)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.float{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-14px)}}
.slide.active .a.float{animation:rise .6s both,floaty 4s ease-in-out 1s infinite;animation-delay:calc(var(--d,0) * .09s + .2s),1.2s}

/* رأس الشريحة */
.sh{display:flex;align-items:center;gap:26px;margin-bottom:30px;flex-wrap:wrap}
.sh h2{font-size:64px;font-weight:900;color:var(--pd);line-height:1.2}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--lav2);color:var(--p);font-size:28px;font-weight:800;
  padding:10px 26px;border-radius:999px;white-space:nowrap}
.stage-tag{background:var(--sun);color:#5A3E00}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.center{align-items:center;justify-content:center;text-align:center}
.row{display:flex;gap:36px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}

/* عناصر عامة */
.card{background:var(--card);border-radius:36px;box-shadow:var(--shadow);padding:36px 40px;position:relative}
.lead{font-size:42px;color:var(--muted);font-weight:500;line-height:1.6}
.big{font-size:48px;font-weight:800;line-height:1.5}
.q{font-size:54px;font-weight:800;color:var(--pd);line-height:1.45;text-align:center}
.muted{color:var(--muted)}
.code{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Consolas,'Courier New',monospace;background:#EFE9FF;color:var(--p);
  padding:2px 18px;border-radius:14px;font-weight:700}
.hl{color:var(--p);font-weight:900}
.chip{display:inline-flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--lav2);border-radius:999px;padding:10px 26px;font-size:30px;font-weight:700;color:var(--pd)}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--p);color:#fff;font-size:34px;font-weight:800;
  padding:18px 42px;border-radius:999px;box-shadow:0 12px 24px -10px rgba(109,75,195,.7);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-4px);box-shadow:0 18px 28px -10px rgba(109,75,195,.8)}
.btn:active{transform:scale(.95)}
.btn.light{background:#fff;color:var(--p);border:3px solid var(--lav2);box-shadow:none}
.btn.mint{background:var(--mint);box-shadow:0 12px 24px -10px rgba(34,184,167,.7)}
.btn.sun{background:var(--sun);color:#5A3E00;box-shadow:0 12px 24px -10px rgba(255,200,87,.8)}
.btn.sm{font-size:28px;padding:12px 30px}
.btn[disabled]{opacity:.45;pointer-events:none}
.hide{display:none!important}
.invis{visibility:hidden}

/* =========================================================
   4) الأسئلة والخيارات
   ========================================================= */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:100%;max-width:1420px;margin:0 auto}
.opt{background:#fff;border:4px solid var(--lav2);border-radius:34px;padding:30px 36px;font-size:46px;font-weight:800;display:flex;align-items:center;gap:24px;
  box-shadow:var(--shadow);transition:transform .2s,border-color .2s,background .2s;text-align:right}
.opt .ic{font-size:64px;width:92px;height:92px;display:grid;place-items:center;background:var(--lav);border-radius:26px;flex:none}
.opt:hover{transform:translateY(-5px);border-color:var(--p2)}
.opt:active{transform:scale(.97)}
.opt.correct{background:var(--mintl);border-color:var(--mint);animation:pop .5s}
.opt.correct .ic{background:#fff}
.opt.wrong{background:var(--pinkl);border-color:var(--pink);animation:shake .5s}
.opt.dim{opacity:.5}
@keyframes pop{40%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.fb{min-height:80px;font-size:48px;font-weight:900;text-align:center;margin-top:26px}
.fb.ok{color:var(--mint);animation:pop .5s}
.fb.no{color:var(--pink);animation:pop .5s}
.explain{font-size:36px;color:var(--muted);text-align:center;margin-top:6px}

/* البطاقات القلابة */
.flips{display:grid;gap:30px;flex:1}
.flip{perspective:1400px;cursor:pointer;min-height:220px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb2{position:absolute;inset:0;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:24px;text-align:center;box-shadow:var(--shadow)}
.flip .fa{background:#fff;border:4px solid var(--lav2)}
.flip .fb2{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;transform:rotateY(180deg)}
.flip:hover .fa{border-color:var(--p2)}
.tap{font-size:24px;color:var(--muted);margin-top:14px;font-weight:700}
.tap::before{content:"👆 "}

/* =========================================================
   5) عناصر خاصة بالشرائح
   ========================================================= */
/* الترحيب والعنوان */
.hero-emoji{font-size:170px;line-height:1}
.t-welcome h1,.t-title h1{font-size:110px;font-weight:900;color:var(--pd);line-height:1.2}
.t-title h1{font-size:150px;background:linear-gradient(90deg,var(--p),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;padding:10px 0}
.teacher{font-size:36px;font-weight:800;color:var(--p);margin-top:18px}
.chips{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.orbit{position:absolute;font-size:90px;opacity:.9}

/* التحضير */
.prep{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:34px;flex:1}
.prep .card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.prep h3{font-size:40px;color:var(--p);font-weight:900}
.date-day{font-size:66px;font-weight:900;color:var(--pd)}
.date-sub{font-size:34px;color:var(--muted);font-weight:700}
.counter{display:flex;align-items:center;gap:22px}
.counter .n{font-size:96px;font-weight:900;color:var(--pd);min-width:150px}
.rbtn{width:76px;height:76px;border-radius:50%;background:var(--lav);font-size:46px;font-weight:900;color:var(--p);transition:.2s}
.rbtn:hover{background:var(--lav2)}
.rbtn:active{transform:scale(.9)}
.checks{display:flex;flex-direction:column;gap:16px;width:100%}
.check{display:flex;align-items:center;gap:18px;background:var(--lav);border-radius:24px;padding:14px 22px;font-size:34px;font-weight:800;transition:.25s;text-align:right}
.check .box{width:50px;height:50px;border-radius:14px;border:4px solid var(--p2);display:grid;place-items:center;font-size:32px;color:#fff;flex:none;transition:.25s}
.check.on{background:var(--mintl)}
.check.on .box{background:var(--mint);border-color:var(--mint)}

/* الجسر (الربط) */
.bridge{display:flex;align-items:center;justify-content:center;gap:40px;flex:1}
.bridge .card{width:640px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:430px;justify-content:center}
.bridge .card h3{font-size:44px;color:var(--pd);font-weight:900}
.bridge .card p{font-size:34px;color:var(--muted);line-height:1.6}
.arrow-big{font-size:120px;color:var(--p);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-18px)}}

/* جدول البيانات */
table.data{border-collapse:separate;border-spacing:0;font-size:40px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
table.data th{background:var(--p);color:#fff;padding:16px 38px;font-weight:800}
table.data td{padding:14px 38px;text-align:center;border-bottom:2px solid var(--lav);font-weight:700}
table.data tr:nth-child(even) td{background:var(--lav)}

/* المؤقت */
.timer{display:flex;align-items:center;gap:16px}
.timer .ring{position:relative;width:150px;height:150px}
.timer svg{width:150px;height:150px;transform:rotate(-90deg)}
.timer .tbg{fill:none;stroke:var(--lav2);stroke-width:12}
.timer .tfg{fill:none;stroke:var(--p);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer .tnum{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:900;color:var(--pd);direction:ltr}
.timer.warn .tfg{stroke:var(--pink)}
.timer.warn .tnum{color:var(--pink);animation:pop .5s infinite}
.timer.done .tnum{color:var(--mint)}
.timer .tb{display:flex;flex-direction:column;gap:10px}
.timer .tb button{width:64px;height:64px;border-radius:50%;background:var(--lav);font-size:30px;color:var(--p);font-weight:900}
.timer .tb button:hover{background:var(--lav2)}
.timer .tlabel{font-size:26px;color:var(--muted);font-weight:800}

/* المخططات */
.chart-svg{width:100%;height:100%;direction:ltr;overflow:visible}
.chart-svg text{font-family:'Tajawal',Tahoma,sans-serif}
.chart-svg .grid{stroke:#E7E2F5;stroke-width:2}
.chart-svg .ax{font-size:22px;fill:#8A83A8;font-weight:700}
.chart-svg .lb{font-size:26px;fill:#3E2A7A;font-weight:800}
.chart-svg .vl{font-size:22px;fill:#3E2A7A;font-weight:900}
.chart-svg .bar{transform-box:fill-box;transform-origin:50% 100%}
.anim .bar{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.anim .ln{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s ease both}
@keyframes draw{from{stroke-dashoffset:1}}
.anim .dot,.anim .vl{animation:fadeIn .4s both;animation-delay:1s}
.anim .pieg{animation:spinIn 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:200px 200px}
@keyframes spinIn{from{transform:rotate(-120deg) scale(.4);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:center;font-size:26px;font-weight:800;color:var(--pd);margin-top:8px}
.legend i{display:inline-block;width:22px;height:22px;border-radius:6px;margin-left:8px;vertical-align:-3px}

/* أنواع المخططات */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;flex:1}
.tcard{background:#fff;border-radius:36px;box-shadow:var(--shadow);border:4px solid transparent;padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px;transition:.25s}
.tcard:hover{transform:translateY(-8px);border-color:var(--p2)}
.tcard.seen{border-color:var(--mint)}
.tcard .mini{width:100%;height:260px}
.tcard h3{font-size:40px;font-weight:900;color:var(--pd)}
.tcard .ico{font-size:60px}
.detail{position:absolute;inset:-26px 0 0 0;background:rgba(251,249,255,.97);border-radius:36px;display:flex;gap:40px;padding:30px;z-index:5;animation:inZoom .45s both}
.detail .dchart{flex:1.1;display:flex;flex-direction:column;justify-content:center}
.detail .dtext{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px}
.detail h3{font-size:62px;font-weight:900;color:var(--p)}
.detail p{font-size:38px;line-height:1.65}
.use{background:var(--mintl);border-radius:26px;padding:20px 28px;font-size:36px;font-weight:800;color:#0F6E63}
.xbtn{position:absolute;top:18px;left:22px;width:70px;height:70px;border-radius:50%;background:var(--lav2);font-size:36px;color:var(--p);font-weight:900;z-index:3}

/* المختبر */
.lab{display:flex;gap:36px;flex:1;min-height:0}
.lab .chartbox{flex:1.35;display:flex;flex-direction:column;padding:26px 30px}
.lab .side{flex:1;display:flex;flex-direction:column;gap:22px}
.seg{display:flex;gap:12px;background:#fff;padding:10px;border-radius:999px;box-shadow:var(--shadow)}
.seg button{flex:1;font-size:28px;font-weight:800;padding:14px 10px;border-radius:999px;color:var(--muted);transition:.2s}
.seg button.on{background:var(--p);color:#fff}
.editor{font-size:30px;font-weight:800;width:100%;border-collapse:separate;border-spacing:0 10px}
.editor th{color:var(--muted);font-size:24px}
.editor td{background:#fff;padding:8px 10px;text-align:center}
.editor td:first-child{border-radius:0 20px 20px 0;color:var(--pd)}
.editor td:last-child{border-radius:20px 0 0 20px}
.stp{display:inline-flex;align-items:center;gap:8px}
.stp button{width:46px;height:46px;border-radius:50%;background:var(--lav);color:var(--p);font-size:30px;font-weight:900}
.stp span{min-width:62px;display:inline-block}
.toggle{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;background:#fff;border-radius:22px;padding:14px 22px;box-shadow:var(--shadow);width:100%}
.toggle .sw{width:74px;height:40px;border-radius:999px;background:var(--lav2);position:relative;transition:.25s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--mint)}
.toggle.on .sw::after{right:39px}
.prompt{background:linear-gradient(135deg,#FFF6DD,#FFF);border:3px dashed var(--sun);border-radius:26px;padding:18px 24px;font-size:30px;font-weight:800;line-height:1.55}

/* فكر – زاوج – شارك */
.tps{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:24px}
.tps .card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:.45;transition:.35s;border:4px solid transparent}
.tps .card.on{opacity:1;border-color:var(--p2);transform:translateY(-8px)}
.tps .card.done{opacity:1;border-color:var(--mint)}
.tps .emo{font-size:84px}
.tps h3{font-size:46px;font-weight:900;color:var(--pd)}
.tps p{font-size:28px;color:var(--muted);font-weight:700}

/* العصف الذهني */
.storm{position:relative;flex:1}
.storm .core{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:520px;height:300px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--p2),var(--p));color:#fff;display:grid;place-items:center;text-align:center;padding:40px;
  font-size:42px;font-weight:900;line-height:1.4;box-shadow:0 30px 60px -20px rgba(109,75,195,.6);z-index:2}
.note{position:absolute;background:#FFF6D6;border-radius:22px;padding:18px 26px;font-size:32px;font-weight:800;box-shadow:var(--shadow);
  animation:noteIn .5s cubic-bezier(.2,1.4,.4,1) both;max-width:430px;text-align:center}
.note.user{background:var(--mintl)}
@keyframes noteIn{from{opacity:0;transform:scale(.3) rotate(-8deg)}}
.addidea{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:10px}
.addidea input{font-size:30px;padding:14px 26px;border-radius:999px;border:3px solid var(--lav2);width:560px;outline:none;background:#fff;color:var(--ink)}
.addidea input:focus{border-color:var(--p)}

/* فراغات التعريف */
.def{font-size:54px;font-weight:700;line-height:2.2;text-align:center;max-width:1500px;margin:0 auto}
.blank{display:inline-block;min-width:240px;border-bottom:6px dashed var(--p2);color:transparent;cursor:pointer;margin:0 8px;border-radius:12px;
  background:var(--lav);transition:.3s;padding:0 18px;line-height:1.5}
.blank::before{content:"؟";color:var(--p2)}
.blank.on{color:var(--p);background:var(--mintl);border-bottom-color:var(--mint);animation:pop .5s}
.blank.on::before{content:""}

/* السيناريوهات */
.scen{display:grid;grid-template-columns:1fr 1fr;gap:26px;flex:1}
.scen .card{padding:24px 30px;display:flex;flex-direction:column;gap:14px;border:4px solid transparent}
.scen .card.ok{border-color:var(--mint);background:#F4FFFD}
.scen .txt{font-size:34px;font-weight:800;line-height:1.5}
.scen .pick{display:flex;gap:14px}
.scen .pick button{flex:1;font-size:26px;font-weight:800;background:var(--lav);border-radius:20px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s;border:3px solid transparent}
.scen .pick button span{font-size:42px}
.scen .pick button:hover{background:var(--lav2)}
.scen .pick button.right{background:var(--mintl);border-color:var(--mint)}
.scen .pick button.bad{background:var(--pinkl);border-color:var(--pink);animation:shake .5s}
.scen .msg{font-size:26px;font-weight:800;min-height:34px;color:var(--mint)}
.scen .msg.no{color:var(--pink)}

/* محاكاة إكسل */
.simwrap{display:flex;gap:30px;flex:1;min-height:0}
.xl{position:relative;flex:1.65;background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:3px solid #D7E6DC}
.xl-top{background:#1E7145;color:#fff;font-size:24px;font-weight:700;padding:10px 22px;display:flex;justify-content:space-between;direction:rtl}
.xl-tabs{display:flex;gap:4px;background:#F3F3F3;padding:8px 14px 0;border-bottom:1px solid #ddd}
.xl-tab{font-size:24px;font-weight:700;padding:10px 20px;border-radius:10px 10px 0 0;color:#444}
.xl-tab.on{background:#fff;color:#1E7145;box-shadow:inset 0 -4px 0 #1E7145}
.xl-tab.special{color:#7A3FC2}
.xl-ribbon{display:flex;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #e3e3e3;min-height:118px;align-items:stretch}
.xl-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:20px;font-weight:700;color:#333;padding:8px 14px;border-radius:12px;min-width:110px;border:2px solid transparent;line-height:1.25;text-align:center}
.xl-btn .i{font-size:40px}
.xl-btn:hover,.xl-tab:hover,.xl-mi:hover{background:#EAF4EE}
.xl-sheet{flex:1;position:relative;padding:16px;background:#FAFAFA;overflow:hidden}
.xl-grid{border-collapse:collapse;font-size:21px;background:#fff;cursor:pointer}
.xl-grid td,.xl-grid th{border:1px solid #D9D9D9;padding:5px 12px;white-space:nowrap;text-align:center}
.xl-grid th{background:#EFEFEF;color:#666;font-weight:600;font-size:18px}
.xl-grid .hdr{background:#E2EFDA;font-weight:800}
.xl-grid .tt{background:#FFF2CC;font-weight:800}
.xl-grid.sel td:not(.rn){background:#C9E3D2!important;outline:1px solid #1E7145}
.xl-chart{position:absolute;left:18px;top:16px;width:52%;height:calc(100% - 32px);background:#fff;border:2px solid #9AB;border-radius:10px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;animation:inZoom .5s both}
.xl-chart .ct{text-align:center;font-size:22px;font-weight:800;color:#555}
.xl-menu{position:absolute;z-index:6;background:#fff;border:2px solid #ccc;border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.2);display:flex;gap:0;animation:inFade .25s both}
.xl-menu .mcol{display:flex;flex-direction:column;padding:8px;min-width:250px;border-left:1px solid #eee}
.xl-mi{font-size:22px;font-weight:700;padding:10px 14px;border-radius:10px;text-align:right;display:flex;gap:10px;align-items:center;border:2px solid transparent;color:#333}
.xl-mi .i{font-size:28px}
.xl-mi.has::after{content:"◂";margin-right:auto;color:#999}
.xl-mi.act{background:#EAF4EE}
.pulse{animation:pulse 1s ease-in-out infinite!important;border-color:var(--sun)!important;background:#FFF5D6!important}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,200,87,.35)}}
.xl .shake{animation:shake .45s}
.steps{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.steps ol{list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:20px;padding:9px 16px;font-size:25px;font-weight:700;line-height:1.45;opacity:.5;transition:.3s;border:3px solid transparent}
.steps li .n{flex:none;width:40px;height:40px;border-radius:50%;background:var(--lav2);color:var(--p);display:grid;place-items:center;font-weight:900}
.steps li.now{opacity:1;border-color:var(--p2);box-shadow:var(--shadow)}
.steps li.done{opacity:1;background:var(--mintl)}
.steps li.done .n{background:var(--mint);color:#fff}
.simmsg{font-size:30px;font-weight:900;text-align:center;min-height:44px}
.simmsg.ok{color:var(--mint)} .simmsg.no{color:var(--pink)}

/* الورقة (الاتجاه والهوامش) */
.paperzone{flex:1;display:flex;align-items:center;justify-content:center}
.paper{background:#fff;box-shadow:0 26px 50px -18px rgba(0,0,0,.35);border-radius:8px;position:relative;transition:width .7s cubic-bezier(.2,.8,.2,1),height .7s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.paper.portrait{width:420px;height:594px}
.paper.landscape{width:720px;height:509px}
.paper .area{position:absolute;inset:34px;border:3px dashed #C9BFEA;transition:inset .4s}
.ptable{border-collapse:collapse;font-size:15px;position:absolute;top:44px;right:44px;white-space:nowrap}
.ptable td,.ptable th{border:1px solid #cfe4c4;padding:6px 8px}
.ptable th{background:#70AD47;color:#fff}
.cut{position:absolute;top:0;bottom:0;left:0;width:90px;background:repeating-linear-gradient(45deg,rgba(242,102,143,.2) 0 12px,rgba(242,102,143,.05) 12px 24px);border-right:4px dashed var(--pink);transition:.4s}
.paper.landscape .cut{opacity:0}
.ptag{font-size:34px;font-weight:900;text-align:center;margin-top:24px;min-height:50px}
.mpaper{width:470px;height:640px}
.mpaper .area{background:rgba(109,75,195,.06);border:3px dashed var(--p2)}
.mpaper .mtable{position:absolute;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:260px;transition:all .4s}
.mpaper .mtable i{height:26px;background:#E2EFDA;border-radius:3px}
.mpaper .mtable i:nth-child(-n+4){background:#70AD47}
.slider{width:100%;accent-color:var(--p);height:40px}
.mval{font-size:64px;font-weight:900;color:var(--p);direction:ltr;text-align:center}

/* الطباعة */
.keys{display:flex;gap:18px;align-items:center;justify-content:center;direction:ltr}
.key{min-width:130px;height:120px;padding:0 26px;border-radius:24px;background:#fff;border:4px solid var(--lav2);border-bottom-width:12px;display:grid;place-items:center;font-size:52px;font-weight:900;color:var(--pd);transition:.2s}
.key.down{transform:translateY(6px);border-bottom-width:5px;background:var(--mintl);border-color:var(--mint)}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%}
.hot{background:#fff;border-radius:24px;padding:18px 22px;text-align:right;box-shadow:var(--shadow);border:3px solid var(--lav2);transition:.25s}
.hot h4{font-size:32px;font-weight:900;color:var(--p)}
.hot p{font-size:25px;line-height:1.5;color:var(--muted);max-height:0;overflow:hidden;transition:max-height .4s}
.hot.on{border-color:var(--mint)}
.hot.on p{max-height:200px;margin-top:6px}
.eco{background:#E7F7EA;border-radius:24px;padding:16px 24px;font-size:28px;font-weight:800;color:#2E7D32;margin-top:14px}

/* صح أم خطأ */
.tf{display:flex;flex-direction:column;gap:16px;flex:1}
.tfrow{display:flex;align-items:center;gap:22px;background:#fff;border-radius:26px;padding:14px 24px;box-shadow:var(--shadow);border:4px solid transparent;transition:.3s}
.tfrow .s{flex:1;font-size:33px;font-weight:800;line-height:1.4}
.tfrow .why{display:block;font-size:24px;color:var(--muted);font-weight:700}
.tfb{width:96px;height:78px;border-radius:22px;font-size:44px;font-weight:900;background:var(--lav);transition:.2s}
.tfb:hover{transform:scale(1.07)}
.tfrow.ok{border-color:var(--mint);background:#F4FFFD}
.tfrow.no{border-color:var(--pink);animation:shake .5s}
.tfrow .res{width:60px;font-size:44px;text-align:center}

/* تحدي الدقيقة */
.minute{display:flex;gap:50px;flex:1;align-items:center;justify-content:center}
.fc{width:900px;height:430px}
.fc .fa{font-size:84px;font-weight:900;color:var(--pd)}
.fc .fb2{font-size:90px;font-weight:900;direction:ltr}
.score{font-size:40px;font-weight:900;color:var(--p);text-align:center}
.score b{font-size:90px;display:block;color:var(--mint)}

/* المجموعات */
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;flex:1}
.groups .flip{min-height:0}
.groups .fa h3{font-size:36px;color:var(--p);font-weight:900}
.groups .fa p{font-size:30px;font-weight:700;line-height:1.5;margin-top:10px}
.groups .fb2 h3{font-size:64px}
.groups .fb2 p{font-size:28px;line-height:1.5;margin-top:10px}
.roles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.roles .chip{font-size:26px;padding:8px 20px}

/* مهمة التطبيق */
.task{display:flex;gap:40px;flex:1}
.task .checks .check{font-size:32px;padding:18px 24px;background:#fff;box-shadow:var(--shadow)}

/* الخريطة الذهنية */
.mind{position:relative;flex:1}
.mind svg.lines{position:absolute;inset:0;width:100%;height:100%}
.mind svg.lines line{stroke:var(--lav2);stroke-width:6;stroke-dasharray:10 10}
.mind .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;
  width:430px;height:190px;border-radius:95px;display:grid;place-items:center;font-size:44px;font-weight:900;box-shadow:0 26px 50px -18px rgba(109,75,195,.7);z-index:2}
.branch{position:absolute;width:470px;transform:translate(-50%,-50%);background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:16px 22px;text-align:center;border:4px solid var(--lav2);transition:.3s;z-index:2}
.branch h4{font-size:34px;font-weight:900;color:var(--pd)}
.branch p{font-size:25px;font-weight:700;color:var(--muted);line-height:1.5;max-height:0;overflow:hidden;transition:max-height .45s,margin .3s}
.branch.on{border-color:var(--mint)}
.branch.on p{max-height:200px;margin-top:6px;color:var(--ink)}

/* التقييم الفوري */
.exit{display:flex;gap:36px;flex:1}
.lights{display:flex;flex-direction:column;gap:20px}
.light{display:flex;align-items:center;gap:18px;background:#fff;border-radius:26px;padding:14px 22px;box-shadow:var(--shadow)}
.light .l{font-size:56px}
.light .t{flex:1;font-size:30px;font-weight:800}
.light .c{font-size:52px;font-weight:900;color:var(--pd);min-width:80px;text-align:center}
.skills .check{font-size:30px;background:#fff;box-shadow:var(--shadow)}
.skills .check .box{border-color:var(--mint)}

/* الختام */
.t-closing h1{font-size:96px;font-weight:900;color:var(--pd);line-height:1.3}
.hw{background:#fff;border-radius:30px;padding:22px 36px;font-size:32px;font-weight:700;box-shadow:var(--shadow);max-width:1300px;line-height:1.6;border-right:10px solid var(--sun)}

/* =========================================================
   6) شريط التحكم والتأثيرات
   ========================================================= */
#bar{position:absolute;bottom:26px;left:50%;transform:translate(-50%,0);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);padding:10px 14px;border-radius:999px;box-shadow:0 16px 40px -14px rgba(62,42,122,.45);z-index:60;transition:opacity .4s,transform .4s}
#bar button{height:66px;min-width:66px;padding:0 24px;border-radius:999px;font-size:26px;font-weight:800;color:var(--p);background:var(--lav);transition:.2s;display:flex;align-items:center;gap:8px}
#bar button:hover{background:var(--lav2);transform:translateY(-2px)}
#bar button:active{transform:scale(.93)}
#bar #clapBtn{font-size:36px;background:#FFF1CC}
#bar #nextBtn{background:var(--p);color:#fff}
#counter{font-size:28px;font-weight:900;color:var(--pd);min-width:120px;text-align:center;direction:ltr}
#hint{position:absolute;bottom:40px;left:30px;font-size:18px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.8);padding:10px 20px;border-radius:999px;z-index:60;transition:opacity .4s}
#hint b{color:var(--p)}
body.idle #bar{opacity:0;transform:translate(-50%,30px);pointer-events:none}
body.idle #hint{opacity:0}
body.idle #stage{cursor:none}

#fx{position:absolute;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.clapfx{position:absolute;bottom:90px;font-size:60px;animation:clapUp 2s ease-out forwards}
@keyframes clapUp{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1;transform:translate(0,-60px) scale(1.1)}100%{opacity:0;transform:translate(var(--dx),-720px) scale(.8) rotate(var(--r))}}
.cf{position:absolute;top:-30px;width:18px;height:28px;border-radius:5px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),1160px) rotate(var(--r))}}
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#fff;padding:18px 44px;border-radius:999px;font-size:40px;font-weight:900;color:var(--p);box-shadow:var(--shadow);animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* لوحة نقاط المجموعات */
#board{position:absolute;inset:0;background:rgba(62,42,122,.5);z-index:70;display:flex;align-items:center;justify-content:center;animation:inFade .3s both}
#board .panel{background:#fff;border-radius:40px;padding:40px 54px;width:1250px;box-shadow:0 40px 80px rgba(0,0,0,.3);position:relative}
#board h2{font-size:56px;font-weight:900;color:var(--pd);text-align:center;margin-bottom:26px}
.gteams{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.gteam{background:var(--lav);border-radius:30px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.gteam .e{font-size:70px}
.gteam .nm{font-size:32px;font-weight:900;color:var(--pd)}
.gteam .pt{font-size:80px;font-weight:900;color:var(--p)}
.gteam .pb{display:flex;gap:12px}
.gteam.lead{background:#FFF3D1;box-shadow:0 0 0 5px var(--sun)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* ======== إضافات: العناصر الجديدة ======== */
.sadu{position:absolute;left:0;right:0;bottom:0;height:18px;z-index:0;opacity:.55;
  background:linear-gradient(135deg,var(--p) 25%,transparent 25%) -18px 0,linear-gradient(225deg,var(--p) 25%,transparent 25%) -18px 0,
  linear-gradient(315deg,var(--sun) 25%,transparent 25%),linear-gradient(45deg,var(--sun) 25%,transparent 25%);background-size:36px 36px}
.basmala{font-family:'Amiri','Traditional Arabic',serif;font-size:64px;color:var(--p);font-weight:700}
.ayah{font-family:'Amiri','Traditional Arabic',serif;font-size:84px;color:var(--pd);line-height:1.7;font-weight:700}
.ref{font-size:28px;color:var(--muted);font-weight:700}
.dua{font-size:46px;font-weight:800;line-height:1.7;color:var(--p);max-width:1500px;text-align:center}
.drawq{background:#FFF1CC;color:#6B4E00;font-size:28px;font-weight:900;padding:10px 26px;border-radius:999px;transition:.2s}
.sh .drawq{margin-inline-start:auto}
.drawq:hover{transform:translateY(-3px);background:#FFE7A3}

/* التحضير */
.att-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.stat{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 22px;font-size:26px;font-weight:800;box-shadow:var(--shadow)}
.stat b{font-size:34px;color:var(--pd)}
.att-grid{display:grid;gap:12px;align-content:start}
.st{position:relative;display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--lav2);border-radius:18px;padding:8px 12px;font-weight:800;text-align:right;transition:.2s;min-height:68px;line-height:1.3}
.st .ic{font-size:26px;flex:none;width:34px;text-align:center}
.st.present{border-color:var(--mint);background:#F2FBF6}
.st.absent{border-color:var(--pink);background:var(--pinkl);opacity:.8;text-decoration:line-through}
.st.late{border-color:var(--sun);background:#FFF8E1}
.st:hover{transform:translateY(-3px)}
.st .del{position:absolute;top:-12px;left:-12px;width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;font-size:20px;display:none;text-decoration:none}
.editing .st .del{display:grid;place-items:center}
.addrow{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.addrow input{font-size:26px;padding:10px 22px;border-radius:999px;border:3px solid var(--lav2);width:420px;outline:none}

/* المجموعات */
.gcols{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;flex:1;min-height:0}
.gcol{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:7px;border-top:12px solid var(--gc);overflow:hidden}
.gcol h3{font-size:34px;font-weight:900;color:var(--gc);text-align:center}
.gcol .cnt{text-align:center;font-size:22px;color:var(--muted);font-weight:700}
.gcol .mem{font-size:23px;font-weight:700;background:var(--lav);border-radius:12px;padding:6px 12px;animation:rise .45s both}
.gteams{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.gteam .nm{color:var(--gc)!important}
.gtag{position:absolute;top:-18px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;font-weight:800;padding:6px 16px;border-radius:999px;white-space:nowrap}
.tcard{position:relative}

/* النوافذ (قرعة/نقاط) */
.modal{position:absolute;inset:0;background:rgba(43,34,80,.45);z-index:70;display:flex;align-items:center;justify-content:center;animation:inFade .3s both}
.modal .panel{background:#fff;border-radius:40px;padding:40px 54px;box-shadow:0 40px 80px rgba(0,0,0,.3);position:relative}
.modal h2{font-size:56px;font-weight:900;color:var(--pd);text-align:center;margin-bottom:20px}
.dname{font-size:104px;font-weight:900;color:var(--p);min-height:200px;display:grid;place-items:center;text-align:center;line-height:1.25}
.dname.spin{color:var(--muted)}
.dname.win{animation:pop .6s}
.dfilter{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dfilter button{padding:8px 20px;border-radius:999px;background:var(--lav);font-size:24px;font-weight:800;color:var(--pd)}
.dfilter button.on{background:var(--p);color:#fff}
.drawn{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:96px;overflow:hidden;margin-top:12px}
.drawn span{background:var(--lav);border-radius:999px;padding:4px 14px;font-size:19px;font-weight:700;color:var(--muted)}

/* التصويت */
.vote{display:flex;flex-direction:column;flex:1;gap:18px;min-height:0}
.vbars{flex:1;display:flex;align-items:flex-end;justify-content:space-around;gap:30px;padding:0 80px;border-bottom:6px solid var(--pd);min-height:0}
.vbar{flex:1;max-width:230px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vbar .b{width:100%;border-radius:18px 18px 0 0;background:var(--c);height:0;transition:height .55s cubic-bezier(.2,1.3,.4,1);min-height:6px}
.vbar .v{font-size:40px;font-weight:900;color:var(--pd);margin-bottom:6px}
.vbar.top .v::before{content:"👑 "}
.vopts{display:flex;justify-content:space-around;gap:30px;padding:0 80px}
.vopt{flex:1;max-width:230px;display:flex;gap:8px}
.vadd{flex:1;background:#fff;border:4px solid var(--lav2);border-radius:24px;padding:10px;font-size:30px;font-weight:900;color:var(--pd);display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow);transition:.2s}
.vadd .ve{font-size:52px}
.vadd:hover{border-color:var(--p2);transform:translateY(-4px)}
.vadd:active{transform:scale(.94)}
.vminus{width:46px;border-radius:16px;background:var(--lav);font-size:28px;font-weight:900;color:var(--p)}
.vrev{font-size:64px;font-weight:900;color:var(--p);text-align:center;animation:pop .6s}

/* الفهم القرائي */
.reading{display:flex;gap:34px;flex:1;min-height:0}
.passage{flex:1.2;font-size:31px;line-height:2;font-weight:600;text-align:justify}
.passage h3{font-size:40px;color:var(--p);font-weight:900;margin-bottom:6px}
.passage .sn{cursor:pointer;border-radius:8px;transition:background .2s}
.passage .sn:hover{background:var(--lav)}
.passage .sn.mark{background:#FFE98A;box-shadow:0 0 0 3px #FFE98A}
.rq{flex:1;display:flex;flex-direction:column;gap:16px}
.qt{font-size:38px;font-weight:900;color:var(--pd);line-height:1.5}
.ropts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ropts .opt{font-size:30px;padding:16px 22px;justify-content:center}
.dotsnav{display:flex;gap:12px;justify-content:center}
.dotsnav i{width:20px;height:20px;border-radius:50%;background:var(--lav2)}
.dotsnav i.on{background:var(--p);transform:scale(1.3)}
.dotsnav i.ok{background:var(--mint)}
.ansbox{background:var(--mintl);border-radius:26px;padding:20px 30px;font-size:32px;font-weight:800;color:#0B5345;line-height:1.7;animation:pop .5s}

/* ربط بالرياضيات */
.mlink{display:flex;gap:40px;flex:1;align-items:center}
.mchart{width:900px;flex:none;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:18px}
.mchart .ct{text-align:center;font-size:32px;font-weight:900;color:var(--pd);padding:6px;border-radius:14px;border:4px dashed transparent;transition:.3s}
.mchart .ct.on{border-color:var(--sun);background:#FFF6D6;animation:pulse 1.2s infinite}
.mchart .plot{position:relative;width:864px;height:496px}
.zone{position:absolute;border:5px dashed transparent;border-radius:14px;transition:.3s;pointer-events:none}
.zone.on{border-color:var(--sun);background:rgba(255,200,87,.2);animation:pulse 1.2s infinite}
.parts{display:flex;flex-direction:column;gap:14px;flex:1}
.part{background:#fff;border:4px solid var(--lav2);border-radius:24px;padding:16px 24px;text-align:right;font-size:34px;box-shadow:var(--shadow);transition:.25s;display:flex;flex-direction:column;gap:4px}
.part .exp{font-size:26px;color:var(--muted);font-weight:700;max-height:0;overflow:hidden;transition:max-height .35s}
.part.on{border-color:var(--sun);background:#FFFBEA}
.part.on .exp{max-height:120px}

/* ارسمي بنفسك */
.builder{display:flex;gap:50px;flex:1;align-items:center}
.bgrid{display:grid;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px 20px;direction:rtl}
.bax{font-size:22px;font-weight:800;color:var(--muted);display:flex;align-items:flex-start;justify-content:center;transform:translateY(-14px)}
.bc{border-top:2px dashed #DCE7E0;margin:0 18px;transition:background .2s}
.bc:hover{background:rgba(0,0,0,.05)}
.bc.f{background:var(--c);border-top-color:transparent;box-shadow:inset 0 -1px 0 rgba(255,255,255,.4)}
.bc.f.bad{outline:4px solid var(--pink);animation:shake .4s}
.bc.f.good{box-shadow:0 0 0 3px var(--mint)}
.blab{font-size:24px;font-weight:900;color:var(--pd);text-align:center;border-top:5px solid var(--pd);padding-top:8px}

/* الأسئلة الإبداعية */
.hq{font-size:52px;font-weight:900;color:var(--pd);line-height:1.6;text-align:center;max-width:1500px}
.ideas{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:60px;max-width:1600px}
.ideas span{background:#FFF6D6;border-radius:18px;padding:10px 20px;font-size:28px;font-weight:800;animation:noteIn .4s both}

/* مشكلات المجموعات */
.mt{width:100%;border-collapse:collapse;font-size:22px;margin-top:10px;font-weight:700}
.mt td{border-bottom:2px solid var(--lav);padding:4px 6px;text-align:right}
.mt td:last-child{text-align:left;font-weight:900;color:var(--p);direction:ltr}

/* ورقة العمل */
.ws{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1}
.wsi{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;border-bottom:8px solid var(--lav2)}
.wsi .e{font-size:66px}
.wsi h4{font-size:34px;font-weight:900;color:var(--pd)}
.wsi p{font-size:26px;color:var(--muted);font-weight:700;line-height:1.5}
a.btn{text-decoration:none}
</style>
</head>

/* ---------------- 🔊 الأصوات (Web Audio API — بدون ملفات خارجية) ---------------- */
let AC = null;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, start, dur, type = "sine", vol = .22) {
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, c.currentTime + start + .015);
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + .05);
}
const Sound = {
  /* صوت تصفيق: نبضات ضوضاء مفلترة بتوقيتات عشوائية تحاكي تصفيق مجموعة */
  clap() {
    const c = ac(), len = c.sampleRate * .12, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const total = 1.8;
    for (let p = 0; p < 5; p++) {                       // 5 "أشخاص" يصفقون
      let t = Math.random() * .08;
      const rate = .16 + Math.random() * .08;
      while (t < total) {
        const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
        s.buffer = buf; f.type = "bandpass"; f.frequency.value = 900 + Math.random() * 1400; f.Q.value = .9;
        const fade = 1 - t / total;
        g.gain.value = (.35 + Math.random() * .35) * fade;
        s.connect(f); f.connect(g); g.connect(c.destination);
        s.start(c.currentTime + t);
        t += rate + (Math.random() - .5) * .05;
      }
    }
  },
  success() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * .09, .35, "triangle", .2)); },

function scale(vals) {
  const m = Math.max(...vals, 1);
  for (const st of [1, 2, 5, 10, 20, 25, 50, 100]) { const n = Math.ceil(m * 1.1 / st); if (n <= 6) return { max: n * st, tn: n }; }
  return { max: Math.ceil(m / 100) * 100, tn: 5 };
}

function colChart(d, o = {}) {

  for (let k = 0; k <= tn; k++) {
    const y = top + ph - ph * k / tn;
    g += `<line class="grid" x1="${left}" x2="${W - right}" y1="${y}" y2="${y}"/>
          <text class="ax" x="${W - right + 12}" y="${y + 8}">${+(max * k / tn).toFixed(1)}</text>`;
  }
  const n = d.labels.length, cw = pw / n, ns = d.series.length, bw = Math.min(56, cw * .72 / ns);
  d.labels.forEach((lb, i) => {
    const cx = W - right - (i + .5) * cw;
    g += `<text class="lb" x="${cx}" y="${H - bot + 36}" text-anchor="middle" style="font-size:${n > 5 ? 20 : 26}px">${lb}</text>`;
    d.series.forEach((s, j) => {
      const v = s.values[i], h = ph * v / max, x = cx - ns * bw / 2 + (ns - 1 - j) * bw, y = top + ph - h;
      g += `<rect class="bar" x="${x + 2}" y="${y}" width="${bw - 4}" height="${h}" rx="6" fill="${s.color || COLORS[j]}" style="animation-delay:${(i * ns + j) * .07}s"/>`;
      if (o.labels) g += `<text class="vl" x="${x + bw / 2}" y="${y - 8}" text-anchor="middle">${v}</text>`;
    });
  });
  return `<svg class="chart-svg ${o.anim === false ? "" : "anim"}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

function lineChart(d, o = {}) {
  const W = 820, H = 470, top = 24, bot = 56, left = 40, right = 70, pw = W - left - right, ph = H - top - bot;
  const { max, tn } = scale(d.series.flatMap(s => s.values));
  let g = "";
  for (let k = 0; k <= tn; k++) {
    const y = top + ph - ph * k / tn;
    g += `<line class="grid" x1="${left}" x2="${W - right}" y1="${y}" y2="${y}"/>
          <text class="ax" x="${W - right + 12}" y="${y + 8}">${+(max * k / tn).toFixed(1)}</text>`;
  }
  const n = d.labels.length, cw = pw / n;
  const px = i => W - right - (i + .5) * cw;
  d.labels.forEach((lb, i) => g += `<text class="lb" x="${px(i)}" y="${H - bot + 36}" text-anchor="middle">${lb}</text>`);
  d.series.forEach((s, j) => {
    const c = s.color || COLORS[j];
    const pts = s.values.map((v, i) => [px(i), top + ph - ph * v / max]);
    g += `<path class="ln" pathLength="1" d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:${j * .3}s"/>`;
    pts.forEach((p, i) => {
      g += `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="10" fill="#fff" stroke="${c}" stroke-width="5"/>`;
      if (o.labels) g += `<text class="vl" x="${p[0]}" y="${p[1] - 20}" text-anchor="middle">${s.values[i]}</text>`;
    });
  });
  return `<svg class="chart-svg ${o.anim === false ? "" : "anim"}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* مخطط دائري / دائري مجوف — rings: مصفوفة من مصفوفات القيم (حلقة لكل سلسلة) */
function pieChart(rings, o = {}) {
  const donut = !!o.donut;
  let g = "";
  const cfg = donut
    ? rings.map((_, k) => ({ r: 150 - k * 52, w: rings.length > 1 ? 40 : 56 }))
    : [{ r: 85, w: 170 }];
  rings.slice(0, cfg.length).forEach((vals, k) => {
    const { r, w } = cfg[k], C = 2 * Math.PI * r, sum = vals.reduce((a, b) => a + b, 0);
    let acc = 0;
    vals.forEach((v, i) => {
      const len = C * v / sum;
      g += `<circle cx="200" cy="200" r="${r}" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="${w}"
              stroke-dasharray="${len} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 200 200)"/>`;
      if (o.labels) {
        const ang = (acc + len / 2) / C * 2 * Math.PI - Math.PI / 2, lr = donut ? r : r * 1.15;
        const txt = o.pct ? Math.round(v / sum * 100) + "%" : (+v.toFixed(1));
        g += `<text class="vl" x="${200 + lr * Math.cos(ang)}" y="${200 + lr * Math.sin(ang) + 8}" text-anchor="middle"
                style="font-size:${donut ? 20 : 24}px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:3px">${txt}</text>`;
      }
      acc += len;
    });
    // فواصل بيضاء بين الشرائح
  });
  return `<svg class="chart-svg ${o.anim === false ? "" : "anim"}" viewBox="-10 -10 420 420" preserveAspectRatio="xMidYMid meet"><g class="pieg">${g}</g></svg>`;
}
function legend(items) {
  return `<div class="legend">${items.map((t, i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${t}</span>`).join("")}</div>`;
}
/* رسم أي نوع من بيانات بصيغة gradesData */
function drawChart(type, d, o = {}) {
  const lg = items => o.noLegend ? "" : legend(items);
  if (type === "column") return colChart(d, o) + lg(d.series.map(s => s.name));
  if (type === "line")   return lineChart(d, o) + lg(d.series.map(s => s.name));
  if (type === "pie") {
    const avg = d.labels.map((_, i) => d.series.reduce((a, s) => a + s.values[i], 0) / d.series.length);
    return pieChart([avg], { labels: o.labels, anim: o.anim, pct: o.pct }) + lg(d.labels);
  }
  if (type === "doughnut") return pieChart(d.series.map(s => s.values), { donut: true, labels: o.labels, anim: o.anim, pct: o.pct }) + lg(d.labels);
}

const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function initTimer(t, api) {
  const C = 2 * Math.PI * 62, fg = $(".tfg", t), num = $(".tnum", t), go = $('[data-t="go"]', t);
  fg.style.strokeDasharray = C;
  let total = +t.dataset.sec, left = total, iv = null;
  const draw = () => { num.textContent = fmt(left); fg.style.strokeDashoffset = C * (1 - left / total); };
  const stop = () => { clearInterval(iv); iv = null; go.textContent = "▶"; };
  const start = () => {
    if (left <= 0) reset();
    go.textContent = "⏸";
    iv = setInterval(() => {
      left--; draw();
      t.classList.toggle("warn", left <= 5 && left > 0);
      if (left <= 5 && left > 0) Sound.tick();
      if (left <= 0) { stop(); t.classList.remove("warn"); t.classList.add("done"); Sound.done(); t.dispatchEvent(new CustomEvent("timerend")); }
    }, 1000);
  };
  const reset = () => { stop(); left = total; t.classList.remove("warn", "done"); draw(); };
  go.onclick = () => iv ? stop() : start();
  $('[data-t="reset"]', t).onclick = reset;
  t.api = { start, stop, reset, set(s) { total = s; reset(); } };
  api.leave.push(stop);
  draw();
}

/* ---------------- 💾 الحفظ (كوكيز + ذاكرة المتصفح كنسخة احتياطية) ----------------
   ملاحظة: بعض المتصفحات (مثل Chrome) لا تحفظ الكوكيز عند فتح الملف مباشرة من الجهاز (file://)،
   لذلك تُحفَظ نسخة في ذاكرة المتصفح (localStorage) أيضًا لضمان عدم ضياع البيانات. */
const Cookie = {
  w(name, v, age = 31536000) { document.cookie = `cs_${name}=${v}; max-age=${age}; path=/; SameSite=Lax`; },
  raw(name) { const m = document.cookie.match(new RegExp("(?:^|; )cs_" + name + "=([^;]*)")); return m ? m[1] : null; },
  set(k, val) {                                   // تقسيم القيمة الطويلة على عدة كوكيز
    const enc = encodeURIComponent(val), size = 3000, n = Math.max(1, Math.ceil(enc.length / size)), old = +this.raw(k + "_n") || 0;
    for (let i = 0; i < n; i++) this.w(`${k}_${i}`, enc.slice(i * size, (i + 1) * size));
    this.w(k + "_n", n);
    for (let i = n; i < old; i++) this.w(`${k}_${i}`, "", -1);
  },
  get(k) {
    const n = +this.raw(k + "_n"); if (!n) return null;
    let s = ""; for (let i = 0; i < n; i++) s += this.raw(`${k}_${i}`) || "";
    try { return decodeURIComponent(s); } catch (e) { return null; }
  }
};
const Store = {
  get(k, def) {
    const c = Cookie.get(k);
    if (c != null) try { return JSON.parse(c); } catch (e) {}
    try { const v = localStorage.getItem("cs_" + k); if (v != null) return JSON.parse(v); } catch (e) {}
    return def;
  },
  set(k, v) {
    const s = JSON.stringify(v);
    try { Cookie.set(k, s); } catch (e) {}
    try { localStorage.setItem("cs_" + k, s); } catch (e) {}
  }
};

function openDraw() {
  if ($("#drawM")) return closeModal("drawM");
  const m = document.createElement("div"); m.id = "drawM"; m.className = "modal";
  m.innerHTML = `<div class="panel" style="width:1250px;text-align:center"><button class="xbtn">✕</button>
    <h2>🎲 قرعة الأسماء</h2>
    <div class="muted" style="font-size:26px;font-weight:700">👭 القرعة من الطالبات الحاضرات فقط</div>

      <button class="btn light sm" data-a="reset">↺ تصفير</button></div>

    <div class="drawn"></div></div>`;
  $("#stage").appendChild(m);
  const name = $(".dname", m);
  const pool = () => {
    let p = Class.present();
    if (noRepeat) p = p.filter(n => !drawn.includes(n));
    return p;
  };
  const info = () => {
    $(".dinfo", m).textContent = `المتبقيات في القرعة: ${pool().length}`;
    $(".drawn", m).innerHTML = drawn.map(n => `<span>${n}</span>`).join("");
  };
  $('[data-a="rep"]', m).onclick = e => { noRepeat = !noRepeat; e.currentTarget.classList.toggle("on", noRepeat); info(); };
  $('[data-a="reset"]', m).onclick = () => { drawn = []; Store.set("drawn", { date: today(), names: drawn }); name.textContent = "من ستكون المحظوظة؟ ✨"; info(); };
  $('[data-a="go"]', m).onclick = () => {
    if (spinning) return;
    const p = pool();
    if (!p.length) { name.textContent = "انتهت الأسماء 🌟 اضغطي تصفير"; Sound.wrong(); return; }
    spinning = true; name.classList.remove("win"); name.classList.add("spin");
    const win = p[Math.floor(Math.random() * p.length)];
    let t = 0, delay = 50;
    const step = () => {
      name.textContent = p[Math.floor(Math.random() * p.length)]; Sound.tick();
      t += delay; delay *= 1.12;
      if (t < 2300) setTimeout(step, delay);
      else {
        name.textContent = win; name.classList.remove("spin"); name.classList.add("win");
        if (!drawn.includes(win)) drawn.push(win);
        Store.set("drawn", { date: today(), names: drawn });
        spinning = false; celebrate(); info();
      }
    };
    step();
  };
  $(".xbtn", m).onclick = () => closeModal("drawM");
  m.onclick = e => { if (e.target === m) closeModal("drawM"); };
  info();
}

  },
  init(el, s) {

};

T.goals = {
  html: s => `<div class="col" style="gap:18px;flex:1">
      ${s.goals.map((g, i) => `<div class="card goal invis" style="padding:20px 36px;font-size:38px;font-weight:800;display:flex;gap:20px;align-items:center">
        <span style="background:var(--lav2);color:var(--p);min-width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:900">${i + 1}</span>${g}</div>`).join("")}
    </div>`,
  /* تظهر الأهداف تلقائيًا واحدًا تلو الآخر عند فتح الشريحة */
  init(el, s, api) {
    const items = $$(".goal", el); let timers = [];
    const clear = () => { timers.forEach(clearTimeout); timers = []; };
    api.enter.push(() => {
      clear();
      items.forEach(it => { it.classList.add("invis"); it.style.animation = ""; });
      items.forEach((it, i) => timers.push(setTimeout(() => {
        it.classList.remove("invis"); it.style.animation = "rise .6s both"; Sound.pop();
      }, 700 + i * 900)));
    });
    api.leave.push(clear);
  }
};

/* العصف الذهني */
T.storm = {
  html: s => `<div class="storm"><div class="core a">${s.core}</div><div class="notes"></div></div>
     <div class="addidea a"><button class="btn sun sm" data-a="idea">💡 فكرة جديدة</button>
     <input type="text" placeholder="✍️ اكتبي فكرة طالبة ثم Enter"></div>`,
  init(el, s) {
    const pos = [[15, 12], [72, 10], [8, 52], [80, 50], [22, 86], [70, 88], [46, 6], [48, 90], [3, 30], [88, 28]];
    let k = 0, ideas = [...s.ideas];
    const add = (txt, user) => {
      const [x, y] = pos[k % pos.length], n = document.createElement("div");
      n.className = "note" + (user ? " user" : ""); n.textContent = txt;
      n.style.left = x + "%"; n.style.top = y + "%"; n.style.transform = `translate(-50%,-50%) rotate(${Math.random() * 8 - 4}deg)`;
      $(".notes", el).appendChild(n); k++; Sound.pop();
    };
    $('[data-a="idea"]', el).onclick = () => ideas.length ? add(ideas.shift()) : toast("انتهت أفكاري… دوركنّ الآن! 😄");
    const inp = $("input", el);
    inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) { add("🙋‍♀️ " + inp.value.trim(), true); inp.value = ""; } };

T.sim = {
  html: s => {
    const cols = s.sheet.head.length, letters = "ABCDEFG".slice(0, cols).split("");
    const grid = `<table class="xl-grid" data-sim="grid">
      <tr><th></th>${letters.map(l => `<th>${l}</th>`).join("")}</tr>
      <tr><th class="rn">1</th><td class="tt" colspan="${cols}">${s.sheet.title}</td></tr>
      <tr><th class="rn">2</th>${s.sheet.head.map(h => `<td class="hdr">${h}</td>`).join("")}</tr>
      ${s.sheet.rows.map((r, i) => `<tr><th class="rn">${i + 3}</th>${r.map((c, j) => `<td class="${j ? "" : "hdr"}">${c}</td>`).join("")}</tr>`).join("")}
    </table>`;
    return `<div class="simwrap">
      <div class="xl a">
        <div class="xl-top"><span>📗 Excel — ${s.file}</span><span>— ☐ ✕</span></div>
        <div class="xl-tabs">${SIM_TABS.map(t => `<button class="xl-tab ${t.id === "home" ? "on" : ""} ${t.hidden ? "hide" : ""} ${t.special ? "special" : ""}" data-sim="tab:${t.id}">${t.label}</button>`).join("")}</div>
        <div class="xl-ribbon"></div>
        <div class="xl-sheet">${grid}<div class="xl-chart hide" data-sim="chart"></div></div>
        <div class="xl-menu hide"></div>
      </div>
      <div class="steps a">
        <ol>${s.steps.map((st, i) => `<li class="${i ? "" : "now"}"><span class="n">${i + 1}</span><span>${st.text}</span></li>`).join("")}</ol>
        <div class="simmsg"></div>
        <div style="display:flex;gap:14px;justify-content:center"><button class="btn sun sm" data-a="hint">💡 تلميح</button><button class="btn light sm" data-a="reset">↺ من جديد</button></div>
      </div></div>`;
  },
  init(el, s) {
    const xl = $(".xl", el), rib = $(".xl-ribbon", el), menu = $(".xl-menu", el), chartBox = $(".xl-chart", el), msg = $(".simmsg", el);
    let step = 0, tab = "home", labels = false;
    const findItem = (list, id) => { for (const b of list) { if (b.id === id) return b; if (b.menu) { const r = findItem(b.menu, id); if (r) return r; } if (b.sub) { const r = findItem(b.sub, id); if (r) return r; } } };
    const drawRibbon = () => {
      rib.innerHTML = (SIM_RIBBON[tab] || []).map(b => `<button class="xl-btn" data-sim="btn:${b.id}"><span class="i">${b.i}</span><span>${b.t}</span></button>`).join("");
      $$(".xl-tab", el).forEach(t => t.classList.toggle("on", t.dataset.sim === "tab:" + tab));
    };
    const openMenu = (anchor, items, append) => {
      const col = `<div class="mcol">${items.map(m => `<button class="xl-mi ${m.sub ? "has" : ""}" data-sim="opt:${m.id}"><span class="i">${m.i}</span>${m.t}</button>`).join("")}</div>`;
      if (!append) { menu.innerHTML = col; menu.style.top = (anchor.offsetTop + anchor.offsetHeight + 4) + "px"; menu.style.right = (xl.offsetWidth - anchor.offsetLeft - anchor.offsetWidth) + "px"; menu.style.left = "auto"; }
      else menu.insertAdjacentHTML("beforeend", col);
      menu.classList.remove("hide");
    };
    const drawChartIn = () => {
      const lab = s.sheet.head.slice(1);
      if (s.chart === "column") {
        const d = { labels: s.sheet.rows.map(r => r[0]), series: lab.map((n, j) => ({ name: n, values: s.sheet.rows.map(r => +r[j + 1]) })) };
        chartBox.innerHTML = `<div class="ct">عنوان المخطط</div><div style="flex:1;min-height:0">${colChart(d, {})}</div>${legend(lab)}`;
      } else {
        const vals = s.sheet.rows.map(r => parseFloat(r[1]));
        chartBox.innerHTML = `<div class="ct">${s.sheet.title}</div><div style="flex:1;min-height:0">${pieChart([vals], { donut: true, labels, pct: true, anim: !labels })}</div>${legend(s.sheet.rows.map(r => r[0]))}`;
      }
      chartBox.classList.remove("hide");
    };
    const updSteps = () => $$(".steps li", el).forEach((li, i) => { li.className = i < step ? "done" : i === step ? "now" : ""; });
    const reset = () => {
      step = 0; tab = "home"; labels = false; drawRibbon(); menu.classList.add("hide"); chartBox.classList.add("hide");
      $(".xl-grid", el).classList.remove("sel"); $('[data-sim="tab:design"]', el).classList.add("hide");
      msg.textContent = ""; updSteps();
    };
    xl.addEventListener("click", e => {
      const t = e.target.closest("[data-sim]"); if (!t || step >= s.steps.length) return;
      const id = t.dataset.sim, st = s.steps[step];
      if (id !== st.target) {
        t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
        msg.className = "simmsg no"; msg.textContent = "ليس هنا… جرّبي مكانًا آخر 💜"; Sound.wrong(); return;
      }
      $$(".pulse", el).forEach(p => p.classList.remove("pulse"));
      const [kind, key] = id.split(":");
      if (kind === "grid") t.classList.add("sel");
      if (kind === "tab") { tab = key; menu.classList.add("hide"); drawRibbon(); }
      if (kind === "btn") { const b = findItem(SIM_RIBBON[tab], key); if (b && b.menu) openMenu(t, b.menu); }
      if (kind === "opt") {
        const m = findItem(SIM_RIBBON[tab], key);
        if (m && m.sub) { t.classList.add("act"); openMenu(t, m.sub, true); } else menu.classList.add("hide");
      }
      const ef = st.effect || {};
      if (ef.showTab) $(`[data-sim="tab:${ef.showTab}"]`, el).classList.remove("hide");
      if (ef.labels) labels = true;
      if (ef.chart || ef.labels) drawChartIn();
      step++; updSteps();
      if (step >= s.steps.length) { msg.className = "simmsg ok"; msg.textContent = "أحسنتِ! أنجزتِ المهمة 🎉"; celebrate(); }
      else { msg.className = "simmsg ok"; msg.textContent = "صحيح! ✔"; Sound.pop(); }
    });
    $('[data-a="hint"]', el).onclick = () => {
      if (step >= s.steps.length) return;
      const tg = $(`[data-sim="${s.steps[step].target}"]`, el); if (tg) tg.classList.add("pulse"); Sound.click();
    };
    $('[data-a="reset"]', el).onclick = reset;
    reset();
  }
};

/* تحدي الدقيقة */
T.minute = {
  html: s => `<div class="minute">
      <div class="col a" style="gap:24px;align-items:center">
        <div class="flip fc"><div class="in"><div class="fa"><span class="ar"></span><div class="tap">اضغطي لكشف الإجابة</div></div><div class="fb2 en"></div></div></div>
        <div class="row" style="gap:18px"><button class="btn mint" data-a="yes">✔ عرفتها!</button><button class="btn light" data-a="skip">⏭ التالية</button></div>
      </div>
      <div class="col a" style="gap:30px;align-items:center">
        ${timerHTML(s.seconds, "")}
        <button class="btn sun" data-a="start">🚀 ابدئي التحدي</button>
        <div class="score">النقاط<b class="pts">0</b></div>
      </div></div>`,
  init(el, s) {
    let deck = [], pts = 0, on = false;
    const card = $(".fc", el), timer = $(".timer", el);
    const show = () => {
      if (!deck.length) deck = shuffle(s.cards);
      const c = deck.pop(); card.classList.remove("on");
      setTimeout(() => { $(".ar", el).textContent = c.ar; $(".en", el).textContent = c.en; }, 200);
    };
    card.onclick = () => { card.classList.toggle("on"); Sound.pop(); };
    $('[data-a="start"]', el).onclick = () => { pts = 0; $(".pts", el).textContent = 0; on = true; timer.api.reset(); timer.api.start(); show(); Sound.pop(); };
    $('[data-a="yes"]', el).onclick = () => { if (!on) return; pts++; $(".pts", el).textContent = pts; Sound.success(); show(); };
    $('[data-a="skip"]', el).onclick = () => { Sound.click(); show(); };
    timer.addEventListener("timerend", () => { on = false; clap(); toast(`انتهى الوقت! نقاطكِ: ${pts} 🏆`); });
    show();
  }
};

    return `<div class="mind a"><svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">${pos.slice(0, s.branches.length).map(([x, y]) => `<line x1="50" y1="50" x2="${x}" y2="${y}" vector-effect="non-scaling-stroke"/>`).join("")}</svg>
      <div class="hub">${s.hub}</div>
      ${s.branches.map((b, i) => `<button class="branch" style="left:${pos[i][0]}%;top:${pos[i][1]}%"><h4>${b.h}</h4><p>${b.p}</p></button>`).join("")}
    </div><p class="lead a" style="text-align:center;font-size:28px;margin-top:18px">👆 اسألي: «ماذا تذكرين عن…؟» ثم اضغطي لكشف الإجابة</p>`;
  },
  init(el) { $$(".branch", el).forEach(b => b.onclick = () => { b.classList.toggle("on"); Sound.pop(); }); }
};

/* التقييم الفوري: إشارات المرور + المهارات */
T.exit = {
  html: s => `<div class="exit">
      <div class="col grow a" style="gap:14px"><div class="big" style="font-size:36px;color:var(--p)">✅ جدول المهارات — هل أتقنتِ؟</div>
        <div class="checks skills">${s.skills.map(k => `<button class="check"><span class="box">✓</span>${k}</button>`).join("")}</div></div>
      <div class="col a" style="width:620px;gap:14px"><div class="big" style="font-size:36px;color:var(--p)">🚦 ارفعي بطاقتك!</div>
        <div class="lights">${[["🟢", "فهمتُ الدرس تمامًا"], ["🟡", "أحتاج توضيحًا بسيطًا"], ["🔴", "أحتاج مساعدة"]].map(([l, t]) => `
          <div class="light"><span class="l">${l}</span><span class="t">${t}</span><button class="rbtn" data-d="-1">−</button><span class="c">0</span><button class="rbtn" data-d="1">+</button></div>`).join("")}</div></div></div>`,
  init(el) {
    $$(".check", el).forEach(c => c.onclick = () => { c.classList.toggle("on"); Sound.pop(); });
    $$(".light", el).forEach(l => $$(".rbtn", l).forEach(b => b.onclick = () => {
      const c = $(".c", l); c.textContent = Math.max(0, +c.textContent + +b.dataset.d); Sound.click();
    }));
  }
};

/* ---------------- 🎬 بناء العرض والتنقل ---------------- */
const deck = $("#deck"), slides = [];
let cur = 0;
CONFIG.slides.forEach((s, i) => {
  const r = T[s.type]; if (!r) return console.warn("نوع شريحة غير معروف:", s.type);
  const el = document.createElement("section");
  el.className = "slide t-" + s.type;
  el.dataset.trans = s.trans || ["fade", "slide", "zoom"][i % 3];
  const inner = r.html(s);
  el.innerHTML = r.noHead ? inner : head(s) + (inner.startsWith('<div class="body') ? inner : `<div class="body">${inner}</div>`);
  deck.appendChild(el);
  const api = { enter: [], leave: [] };
  $$(".timer", el).forEach(t => initTimer(t, api));
  r.init && r.init(el, s, api);
  $$(".a", el).forEach((a, k) => a.style.setProperty("--d", k));
  slides.push({ el, s, api });
});

function go(n) {
  if (n < 0 || n >= slides.length || n === cur) return;
  const old = slides[cur], nw = slides[n];
  old.api.leave.forEach(f => f());
  old.el.classList.remove("active"); old.el.classList.add("leaving");
  setTimeout(() => old.el.classList.remove("leaving"), 450);
  nw.el.dataset.dir = n > cur ? "f" : "b";
  nw.el.classList.add("active");
  nw.api.enter.forEach(f => f());
  cur = n; updateUI();
}
const next = () => go(cur + 1), prev = () => go(cur - 1);
function updateUI() {
  $("#counter").textContent = `${cur + 1} / ${slides.length}`;
  $("#progress").style.width = ((cur + 1) / slides.length * 100) + "%";
}
slides[0].el.classList.add("active"); slides[0].el.dataset.dir = "f"; updateUI();

/* ---------------- ⌨️ لوحة المفاتيح ---------------- */
const typing = e => /^(input|textarea|select)$/i.test(e.target.tagName) || e.target.isContentEditable;
window.addEventListener("keydown", e => {
  if (typing(e)) { if (e.key === "Escape") e.target.blur(); return; }
  if ((e.ctrlKey || e.metaKey) && e.code === "KeyP") {           // تحدي الطباعة
    const h = slides[cur].api.ctrlP; if (h) { e.preventDefault(); h(); } return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === " " || e.code === "Space" || k === "ArrowRight" || k === "PageDown") { e.preventDefault(); next(); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); prev(); }
  else if (k === "ArrowUp" || k === "ArrowDown") { e.preventDefault(); }
  else if (k === "Home") { e.preventDefault(); go(0); }
  else if (k === "End") { e.preventDefault(); go(slides.length - 1); }
  else if (k === "ت" || e.code === "KeyF") { e.preventDefault(); clap(); }     // ت (نفس زر F)
  else if (k === "ق" || e.code === "KeyR") { e.preventDefault(); openDraw(); }       // ق (نفس زر R)
  else if (k === "Escape") { closeModal("board"); closeModal("drawM"); }
}, true);
window.addEventListener("keyup", e => { if (!typing(e) && (e.code === "Space" || e.key === " ")) e.preventDefault(); }, true);
/* إلغاء التركيز بعد الضغط كي لا يُعاد تفعيل الزر بالمسافة */
document.addEventListener("click", e => { const b = e.target.closest("button"); if (b) b.blur(); ac(); });

/* ---------------- 🎛️ شريط التحكم ---------------- */
$("#nextBtn").onclick = next;
$("#prevBtn").onclick = prev;
$("#clapBtn").onclick = clap;
$("#fsBtn").onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
};
let idleT;
function wake() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2800); }
["mousemove", "mousedown", "touchstart"].forEach(ev => window.addEventListener(ev, wake, { passive: true }));
wake();

$("#boardBtn").onclick = openBoard;
$("#drawBtn").onclick = openDraw;

/* ---------------- 📐 ملاءمة الشاشة (16:9 ثابت) ---------------- */
function fit() {
  const sc = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("#stage").style.transform = `translate(-50%,-50%) scale(${sc})`;
}
window.addEventListener("resize", fit); fit();
/* منع أي تمرير داخلي (مثلًا عند التركيز على عنصر) حتى لا تتحرك الشريحة */
document.addEventListener("scroll", e => {
  const t = e.target === document ? document.scrollingElement : e.target;
  if (t && (t.scrollTop || t.scrollLeft)) { t.scrollTop = 0; t.scrollLeft = 0; }
}, true);
/* منع التمرير بعجلة الفأرة أو اللمس */
window.addEventListener("wheel", e => e.preventDefault(), { passive: false });
window.addEventListener("touchmove", e => { if (!e.target.closest("input")) e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
